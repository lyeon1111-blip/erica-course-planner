<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="한양대 ERICA 수강신청 도우미 — 졸업요건 진단과 시간표 짜기를 한 화면에서. 시연용 시안.">
<meta name="robots" content="noindex">
<title>ERICA 수강신청 도우미 — 시연</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 레이아웃: 좁으면 한 칸, 900px 위에서는 왼쪽 시간표 · 오른쪽 과목 목록 두 칸.
   색은 masstige.io 기준 — 흰 바탕에 라임 블록, 검정 잉크, 알약 모양. */
:root{
  --plane:#eef3f9; --surface:#fff; --sunken:#f3f7fb; --card:#fff;
  --ink:#0f1c2d; --ink2:#44586f; --muted:#8094aa;
  --rule:#dde6f0; --rule2:#c2d0e0;
  --lime:#0e4a84;            /* 한양 블루 — 담은 것 · 행동 */
  --ok:#0e4a84;
  --blue2:#2a78d6;           /* 밝은 파랑 — 보조 */
  --tint:#e6eff9;            /* 아주 연한 파랑 면 */
  --good:#0a7d3c; --warn:#b5781a; --no:#c6362f;
  --lav:#2a78d6;
  --onlime:#fff; --onfill:#fff;
  --r:16px; --pill:100px; --ui:1;
  --f:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --plane:#070d15; --surface:#0f1925; --sunken:#152130; --card:#0f1925;
  --ink:#eef3f9; --ink2:#a8bbd0; --muted:#7a8ca1;
  --rule:#1e2b3b; --rule2:#2d3e52;
  --lime:#4b9bea; --ok:#4b9bea; --blue2:#6fb2f2; --tint:#13243a;
  --good:#3fbf6a; --warn:#d9a441; --no:#e4675f; --lav:#6fb2f2;
  --onlime:#06111c; --onfill:#06111c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --plane:#070d15; --surface:#0f1925; --sunken:#152130; --card:#0f1925;
  --ink:#eef3f9; --ink2:#a8bbd0; --muted:#7a8ca1;
  --rule:#1e2b3b; --rule2:#2d3e52;
  --lime:#4b9bea; --ok:#4b9bea; --blue2:#6fb2f2; --tint:#13243a;
  --good:#3fbf6a; --warn:#d9a441; --no:#e4675f; --lav:#6fb2f2;
  --onlime:#06111c; --onfill:#06111c; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--ui))}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--f);font-size:1rem;line-height:1.6}
.wrap{max-width:74rem;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:2rem;font-weight:800;margin:0 0 .5rem;letter-spacing:-.045em;line-height:1.18}
.top{padding-block:2rem .2rem}
.draft{font-size:.72rem;font-weight:700;vertical-align:middle;padding:.2rem .6rem;
  border-radius:var(--pill);background:var(--sunken);border:1px solid var(--rule);color:var(--muted);
  letter-spacing:0;margin-left:.4rem}
.top p{margin:0;color:var(--ink2);font-size:.95rem}
.eyebrow{display:inline-flex;align-items:center;gap:.4rem;font-size:.76rem;font-weight:700;
  color:var(--ink2);letter-spacing:.02em;margin-bottom:.5rem}
.eyebrow::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--ok)}
.tryl{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.tryl span{font-size:.78rem;font-weight:600;background:var(--sunken);border:1px solid var(--rule);
  border-radius:var(--pill);padding:.3rem .8rem;color:var(--ink2);display:inline-flex;align-items:center;gap:.35rem}
.tryl span::before{content:"";width:.33rem;height:.33rem;border-radius:50%;background:var(--muted)}
.sizer{display:flex;gap:.4rem;margin-top:1rem;align-items:center;flex-wrap:wrap}
.sizer .lb{font-size:.78rem;color:var(--muted);font-weight:700}
.szb{font-family:var(--f);font-size:.82rem;font-weight:700;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink2);padding:.38rem .85rem;border-radius:var(--pill);cursor:pointer}
.szb[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.szb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{margin:1.4rem auto 3rem;background:var(--surface);border:1px solid var(--rule);
  border-radius:22px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03),0 12px 34px rgba(0,0,0,.06)}
.app.narrow{max-width:26.25rem}
.hdr{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;
  border-bottom:1px solid var(--rule);background:var(--card);flex-wrap:wrap}
.hdr .ttl{font-size:1.15rem;font-weight:800;letter-spacing:-.04em}
.hdr .sem{font-size:.8rem;color:var(--muted);font-weight:600}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:.7rem}
.hdr .cnt{font-size:1.05rem;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.hdr .cnt small{font-size:.76rem;font-weight:500;color:var(--muted);letter-spacing:0}
.pips{display:flex;gap:4px}
.pip{width:.5rem;height:.5rem;border-radius:50%;background:var(--rule2);display:inline-block}
.pip.on{background:var(--good)}

.cols{display:grid;grid-template-columns:minmax(23.75rem,26.25rem) 1fr;align-items:start}
.left{padding:1.2rem;border-right:1px solid var(--rule)}
.right{padding:1.2rem;min-width:0;max-height:40rem;overflow-y:auto}
.app.narrow .cols{grid-template-columns:1fr}
.app.narrow .left{border-right:0;border-bottom:1px solid var(--rule)}
.app.narrow .right{max-height:26rem}

/* 시간표 */
.tt{--rowh:1.875rem;--head:1.625rem;--gut:1.5rem;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--card);
  position:relative;overflow:hidden;padding:0 7px 7px}
.tt .grid{display:grid;grid-template-columns:var(--gut) repeat(5,1fr)}
.tt .hd{height:var(--head);display:flex;align-items:center;justify-content:center;
  font-size:.76rem;font-weight:700;color:var(--ink2)}
.tt .hd.free{color:var(--muted);text-decoration:line-through}
.tt .hr{height:var(--rowh);font-size:.64rem;color:var(--muted);line-height:1;font-weight:500;
  display:flex;align-items:flex-start;justify-content:flex-end;padding-right:6px;transform:translateY(-.3em)}
.tt .cell{height:var(--rowh);padding:0;background:none;cursor:pointer;border:0;
  border-top:1px solid color-mix(in srgb,var(--rule) 70%,transparent)}
.tt .cell:hover{background:color-mix(in srgb,var(--ok) 11%,transparent)}
.tt .cell:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:4px}
.tt .cell.freeday{background:color-mix(in srgb,var(--muted) 12%,transparent);cursor:not-allowed}
.tt .cell.picked{background:color-mix(in srgb,var(--ok) 20%,transparent)}
.blk{position:absolute;border-radius:10px;font-size:.7rem;line-height:1.24;padding:4px 7px;
  overflow:hidden;color:var(--onlime);background:var(--lime);z-index:2;border:0;font-family:var(--f);
  text-align:left;cursor:pointer;font-weight:700;display:flex;flex-direction:column;gap:1px;
  letter-spacing:-.02em}
.blk .bt{font-size:.62rem;opacity:.7;font-weight:500;letter-spacing:0}
.blk:hover{filter:brightness(1.04)}
.blk:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.blk.cl{background:var(--no);color:#fff}
.blk.ghost{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);
  border:1.5px dashed var(--ok);cursor:default;z-index:1}
.tthint{font-size:.74rem;color:var(--muted);text-align:center;padding:.6rem 0 0;font-weight:500}

/* 공강 */
.freerow{display:flex;align-items:center;gap:.35rem;margin-top:.9rem;flex-wrap:wrap}
.freerow .lb{font-size:.78rem;color:var(--muted);font-weight:700;margin-right:.2rem}
.dayb{font-family:var(--f);font-size:.82rem;font-weight:700;border:1px solid var(--rule);
  background:var(--sunken);color:var(--ink2);min-width:2.75rem;height:2.75rem;
  border-radius:var(--pill);cursor:pointer;padding:0 .35rem}
.dayb[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.dayb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 학점 + 메시지 */
.sumbar{display:flex;align-items:center;gap:.9rem;padding:.9rem 1rem;margin-top:.9rem;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
.sumbar .n{font-size:1.6rem;font-weight:800;letter-spacing:-.04em;white-space:nowrap}
.sumbar .n span{font-size:.84rem;color:var(--muted);font-weight:600;letter-spacing:0}
.sumbar .x{flex:1;min-width:0}
.sumbar .lab{font-size:.76rem;color:var(--muted);margin-bottom:.4rem;font-weight:600}
.gauge{height:.6rem;border-radius:var(--pill);background:var(--sunken);overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--rule)}
.gauge i{display:block;height:100%;background:var(--lime);border-radius:var(--pill);transition:width .25s}
.gauge i.done{background:var(--lime)}
.msg{margin-top:.75rem;border-radius:var(--r);padding:.8rem .95rem;font-size:.88rem;font-weight:500;
  border:1px solid var(--rule);background:var(--sunken);color:var(--ink2)}
.msg.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 11%,transparent);color:var(--ink)}
.msg.warn{border-color:var(--rule2);background:var(--card);color:var(--ink)}
.msg.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 9%,var(--card));color:var(--ink)}
.msg b{font-weight:800}
.inline{font-family:var(--f);font-size:.8rem;font-weight:700;border:1px solid var(--ok);background:var(--ok);
  color:#fff;border-radius:var(--pill);padding:.22rem .7rem;cursor:pointer;margin-left:.4rem}
.inline.ghostb{background:transparent;color:var(--ok);border-color:var(--ok)}

/* 담은 과목 */
.mine{margin-top:1rem}
.mrow{display:flex;align-items:center;gap:.5rem;padding:.45rem .75rem;border:1px solid var(--rule);
  border-radius:var(--pill);background:var(--card);font-size:.84rem;margin-bottom:.35rem;font-weight:600}
.mrow .g{color:var(--muted);font-size:.76rem;margin-left:auto;white-space:nowrap;font-weight:500}
.mrow button{font-family:var(--f);border:1px solid var(--rule2);background:none;color:var(--ink2);
  border-radius:var(--pill);padding:.14rem .6rem;font-size:.76rem;cursor:pointer;font-weight:600}
.mrow button:hover{border-color:var(--ink);color:var(--ink)}

/* 요건 칩 */
.chips{display:flex;gap:.45rem;flex-wrap:wrap;padding-bottom:.5rem;margin-bottom:.3rem}
.app.narrow .chips{flex-wrap:nowrap;overflow-x:auto}
.chip{flex:none;font-family:var(--f);border:1px solid var(--rule);border-radius:var(--pill);
  background:var(--sunken);color:var(--muted);padding:.46rem .95rem;cursor:pointer;font-size:.85rem;
  font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:.45rem;letter-spacing:-.01em}
.chip::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:currentColor;flex:none}
.chip.left{background:var(--card);color:var(--ok);border-color:var(--ok)}
.chip:hover{color:var(--ink2);border-color:var(--rule2)}
.chip.left:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip .dots{letter-spacing:-1px;font-size:.72rem}
.chip.ok{background:var(--card);color:var(--good);border-color:var(--good)}
.chip.ok[aria-pressed="true"]{background:var(--good);color:#fff;border-color:var(--good)}

.fbar{display:flex;align-items:center;gap:.5rem;margin:.6rem 0 .3rem;padding:.55rem .5rem .55rem .9rem;
  border-radius:var(--pill);background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ink);
  border:1px solid var(--ok);font-size:.84rem;font-weight:700}
.fbar .x{margin-left:auto;font-family:var(--f);border:0;background:none;color:var(--ink2);
  cursor:pointer;font-size:1.05rem;line-height:1;padding:.1rem .6rem}

.secl{font-size:.76rem;font-weight:700;color:var(--muted);margin:1rem 0 .5rem}
.list{display:flex;flex-direction:column;gap:.5rem}
.item{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);padding:.85rem 1rem;
  transition:border-color .12s}
.item:hover{border-color:var(--rule2)}
.item.has{border-color:var(--ok);background:var(--tint);box-shadow:inset 0 0 0 1px var(--ok)}
.ihead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem .65rem}
.item .nm{font-size:1rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere;letter-spacing:-.035em}
.item .mt{font-size:.78rem;color:var(--muted);display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;font-weight:500}
.tag{font-size:.69rem;font-weight:700;padding:.1rem .5rem;border-radius:var(--pill);
  background:var(--sunken);color:var(--ink2)}
.tag.e{background:var(--ok);color:var(--onfill)}
.tag.p{background:var(--warn);color:#0b0b0b}
.secs{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.65rem}
.sec{font-family:var(--f);font-size:.82rem;font-weight:700;border:1px solid var(--rule2);
  background:var(--surface);color:var(--ink);border-radius:var(--pill);padding:.38rem .8rem;cursor:pointer;
  display:inline-flex;align-items:center;gap:.35rem;transition:border-color .12s,background .12s;
  letter-spacing:-.01em}
.sec:hover{border-color:var(--ok);color:var(--ok)}
.sec:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sec.on{background:var(--lime);border-color:var(--lime);color:var(--onlime)}
.sec.cl,.sec.dup,.sec.off{color:var(--muted);border-color:var(--rule);background:var(--sunken)}
.sec.cl:hover,.sec.dup:hover,.sec.off:hover{border-color:var(--rule2);color:var(--muted)}
.sec .fl{font-style:normal;font-size:.66rem;font-weight:700;color:var(--warn);
  font-variant-numeric:tabular-nums}
.sec.on .fl{color:#fff;opacity:.8}
.foot-note{font-size:.78rem;color:var(--muted);margin:1rem 0 0;line-height:1.6;font-weight:500}
.foot-note b{color:var(--ink2);font-weight:700}
.empty{text-align:center;padding:2rem .8rem}
.empty b{display:block;color:var(--ink);font-size:.95rem;font-weight:700}
.empty p{margin:.4rem 0 1rem;color:var(--muted);font-size:.85rem;font-weight:500}

/* ── 경쟁률 대시보드 ─────────────────────────────────── */
.bcard.wide{grid-area:wide;flex-direction:row;align-items:center;gap:1.6rem;flex-wrap:wrap}
.bcard.wide .wl{flex:1;min-width:16rem}
.bcard.wide .wr{display:flex;gap:1.6rem;flex-wrap:wrap}
.dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.6rem;margin-bottom:1.3rem}
.dtile{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);padding:.9rem 1rem}
.dtile .v{font-size:1.7rem;font-weight:800;letter-spacing:-.04em;line-height:1.1;display:block}
.dtile .k{font-size:.76rem;color:var(--muted);display:block;margin-top:.25rem;font-weight:500}
.dgrid{display:grid;grid-template-columns:minmax(20rem,26rem) 1fr;gap:1.2rem;align-items:start}
@media (max-width:900px){.dgrid{grid-template-columns:1fr}}
.panel{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);padding:1.1rem}
.panel h3{margin:0 0 .25rem;font-size:1rem;font-weight:800;letter-spacing:-.035em}
.panel .ph{font-size:.8rem;color:var(--muted);margin:0 0 .9rem;font-weight:500}
/* 히트맵 */
.hm{display:grid;grid-template-columns:1.7rem repeat(5,1fr);gap:3px}
.hm .lbl{font-size:.68rem;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600}
.hm .cl{aspect-ratio:1/.72;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:700;color:#fff;background:var(--sunken)}
.hm .cl.e{color:var(--muted);font-weight:500}
.hm .cl:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;z-index:2;position:relative}
.hmtab{margin-top:.9rem;font-size:.78rem}
.hmtab summary{cursor:pointer;color:var(--blue2);font-weight:700;padding:.3rem 0}
.hmtab table{border-collapse:collapse;width:100%;margin-top:.5rem}
.hmtab th,.hmtab td{border:1px solid var(--rule);padding:.3rem .2rem;text-align:center;font-weight:600}
.hmtab thead th,.hmtab tbody th{background:var(--sunken);color:var(--ink2);font-size:.72rem}
.hmtab td{color:var(--ink);font-variant-numeric:tabular-nums}
.hmleg{display:flex;align-items:center;gap:.4rem;margin-top:.8rem;font-size:.72rem;color:var(--muted);font-weight:600}
.hmleg .sw{width:1.4rem;height:.6rem;border-radius:3px}
/* 격차 목록 */
.gaps{display:flex;flex-direction:column;gap:.6rem}
.gap{border:1px solid var(--rule);border-radius:var(--r);padding:.75rem .9rem;background:var(--card)}
.gap .gh{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.55rem}
.gap .gn{font-size:.93rem;font-weight:800;letter-spacing:-.03em}
.gap .gd{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--ok);white-space:nowrap}
.gsecs{display:flex;flex-wrap:wrap;gap:.35rem}
.gsec{font-size:.78rem;font-weight:700;border-radius:var(--pill);padding:.26rem .62rem;
  display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--rule2);background:var(--surface)}
.gsec b{font-variant-numeric:tabular-nums}
.gsec.low{border-color:var(--good);color:var(--good)}
.gsec.high{border-color:var(--no);color:var(--no)}
/* 막대 */
.brow{display:grid;grid-template-columns:minmax(7rem,11rem) 1fr auto;gap:.6rem;align-items:center;
  font-size:.84rem;margin-bottom:.4rem}
.brow .bn{font-weight:600;overflow-wrap:anywhere;min-width:0}
.btrack{min-width:0;position:relative;display:block;background:var(--sunken);border-radius:4px;height:1.1rem}
.bfill{display:block;height:100%;border-radius:4px;background:var(--ok);max-width:100%}
.btrack::after{content:"";position:absolute;top:-2px;bottom:-2px;left:var(--ref,70%);width:1px;
  background:var(--ink2);opacity:.4}
.bv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.8rem}

/* ── 설정 ───────────────────────────────────────────── */
.fab{position:fixed;z-index:50;
  right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));
  display:inline-flex;align-items:center;gap:.45rem;font-family:var(--f);font-size:.82rem;font-weight:700;
  background:var(--surface);color:var(--ink2);border:1px solid var(--rule2);border-radius:var(--pill);
  padding:.5rem .9rem;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.fab:hover{border-color:var(--ok);color:var(--ok)}
.fab:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.fab .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--no);display:inline-block}
.fab.ok .dot{background:var(--good)}
.setwrap{max-width:46rem}
.sgroup{margin-bottom:1.6rem}
.sgroup .q{font-size:1.05rem;font-weight:800;letter-spacing:-.035em;margin:0 0 .2rem}
.sgroup .hint{font-size:.84rem;color:var(--muted);margin:0 0 .75rem;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:.45rem}
.opt{font-family:var(--f);font-size:.88rem;font-weight:700;border:1px solid var(--rule2);
  background:var(--surface);color:var(--ink);border-radius:var(--pill);padding:.5rem 1rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ok);color:var(--ok)}
.opt[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
.opt:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.opt small{font-weight:500;opacity:.75;margin-left:.3rem}
.pastebox{border:1px dashed var(--rule2);border-radius:var(--r);background:var(--sunken);
  padding:1.1rem;text-align:center}
.pastebox p{margin:0 0 .8rem;font-size:.86rem;color:var(--ink2);font-weight:500}
.pastebox.on{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.readout2{font-size:.88rem;font-weight:700;color:var(--good);display:flex;align-items:center;
  justify-content:center;gap:.4rem}
.notice{display:flex;align-items:flex-start;gap:.6rem;padding:.8rem .95rem;border-radius:var(--r);
  background:color-mix(in srgb,var(--no) 9%,transparent);border:1px solid var(--no);
  font-size:.88rem;font-weight:600;color:var(--ink);margin-bottom:1.4rem}

/* ── 진단 화면 ───────────────────────────────────────── */
.dcols{display:grid;grid-template-columns:minmax(21rem,24rem) 1fr;align-items:start}
.app.narrow .dcols{grid-template-columns:1fr}
.app.narrow .dleft{border-right:0;border-bottom:1px solid var(--rule)}
.dleft{padding:1.4rem;border-right:1px solid var(--rule)}
.dright{padding:1.4rem;min-width:0;max-height:40rem;overflow-y:auto}
.app.narrow .dright{max-height:none;overflow:visible}
.bignum{font-size:3.4rem;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--ok)}
.bignum small{font-size:1.1rem;font-weight:700;letter-spacing:-.02em}
.bigsub{font-size:.88rem;color:var(--ink2);margin-top:.5rem;font-weight:500}
.totg{height:.75rem;border-radius:var(--pill);background:var(--sunken);overflow:hidden;margin-top:1rem;
  box-shadow:inset 0 0 0 1px var(--rule);display:flex}
.totg i{display:block;height:100%}
.totg .got{background:var(--ok)}
.totg .plan{background:color-mix(in srgb,var(--ok) 38%,transparent)}
.legrow{display:flex;gap:1rem;margin-top:.6rem;font-size:.76rem;color:var(--muted);font-weight:600;flex-wrap:wrap}
.legrow span{display:inline-flex;align-items:center;gap:.35rem}
.legrow i{width:.6rem;height:.6rem;border-radius:3px;display:inline-block}
.extra{margin-top:1.6rem}
.xrow{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--rule);font-size:.88rem}
.xrow:last-child{border-bottom:0}
.xrow .mk{width:1.25rem;height:1.25rem;border-radius:50%;flex:none;display:inline-flex;
  align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
.xrow .mk.y{background:var(--good);color:#fff}
.xrow .mk.n{background:var(--sunken);color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule2)}
.xrow .v{margin-left:auto;font-weight:700;font-size:.82rem;color:var(--ink2);white-space:nowrap}
.xrow.done .v{color:var(--good)}
.areas{display:flex;flex-direction:column;gap:.55rem}
.arow{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);padding:.85rem 1rem}
.arow.done{border-color:var(--good)}
.ahead{display:flex;align-items:baseline;gap:.5rem}
.ahead .nm{font-size:.98rem;font-weight:800;letter-spacing:-.03em}
.ahead .st{margin-left:auto;font-size:.84rem;font-weight:700;color:var(--ok);white-space:nowrap}
.arow.done .ahead .st{color:var(--good)}
.abar{height:.5rem;border-radius:var(--pill);background:var(--sunken);overflow:hidden;margin-top:.6rem;
  box-shadow:inset 0 0 0 1px var(--rule);display:flex}
.abar i{display:block;height:100%}
.abar .got{background:var(--ok)}
.abar .plan{background:color-mix(in srgb,var(--ok) 38%,transparent)}
.arow.done .abar .got{background:var(--good)}
.anum{font-size:.76rem;color:var(--muted);margin-top:.4rem;font-weight:500}
.cta{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.5rem;font-family:var(--f);
  font-size:.92rem;font-weight:700;border:0;background:var(--ok);color:#fff;
  border-radius:var(--pill);padding:.7rem 1.2rem;cursor:pointer}
.cta:hover{filter:brightness(1.08)}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.planline{margin-top:1rem;padding:.7rem .85rem;border-radius:var(--r);background:var(--tint);
  font-size:.86rem;font-weight:600;color:var(--ink)}

/* ── 선택 창 (벤토 그리드) ───────────────────────────── */
.bento{display:grid;gap:.9rem;grid-template-columns:1.18fr 1fr 1fr;
  grid-template-areas:"hero two two" "hero three four" "wide wide wide";align-items:stretch}
.bcard{border-radius:26px;padding:1.6rem 1.7rem;position:relative;overflow:hidden;
  display:flex;flex-direction:column;text-align:left;font-family:var(--f);cursor:pointer;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);
  transition:transform .14s,box-shadow .14s}
.bcard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.09)}
.bcard:focus-visible{outline:2px solid var(--ok);outline-offset:3px}
.bcard.hero{grid-area:hero;background:var(--tint);border-color:color-mix(in srgb,var(--ok) 20%,transparent)}
.bcard.two{grid-area:two} .bcard.three{grid-area:three}
.bcard.four{grid-area:four;background:var(--ok);color:#fff;border-color:var(--ok)}
.bcard.four .bdesc{color:rgba(255,255,255,.8)}
.bcard.four .bstep{background:rgba(255,255,255,.16);color:#fff}
.bcard.four .btag{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.bcard.four .bgo{color:#fff}
.bcard.four .bgo i{background:#fff;color:var(--ok)}
.bstep{display:inline-flex;align-items:center;gap:.4rem;align-self:flex-start;
  font-size:.74rem;font-weight:700;letter-spacing:.02em;padding:.34rem .8rem;
  border-radius:var(--pill);background:var(--card);color:var(--ink2);border:1px solid var(--rule);
  margin-bottom:.9rem}
.bcard.four .bstep{border-color:transparent}
.btitle{font-size:1.45rem;font-weight:800;letter-spacing:-.045em;line-height:1.24;margin:0 0 .6rem}
.bcard.hero .btitle{font-size:2.1rem;margin-bottom:.9rem}
.bdesc{font-size:.9rem;color:var(--ink2);margin:0;font-weight:500;line-height:1.62}
.bdesc b{font-weight:700;color:var(--ink)}
.btags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.btag{font-size:.76rem;font-weight:700;padding:.3rem .75rem;border-radius:var(--pill);
  background:var(--card);border:1px solid var(--rule);color:var(--ink2)}
.bgo{display:inline-flex;align-items:center;gap:.5rem;margin-top:auto;padding-top:1.2rem;
  font-size:.92rem;font-weight:700;color:var(--ok)}
.bgo i{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--ok);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.85rem}
.brule{height:1px;background:var(--rule2);margin:1.4rem 0 1.2rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem .8rem}
.stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.04em;line-height:1.1;display:block}
.stat .k{font-size:.76rem;color:var(--muted);font-weight:500;display:block;margin-top:.15rem}
.soon{font-size:.72rem;font-weight:700;padding:.14rem .5rem;border-radius:var(--pill);
  background:var(--warn);color:#0b0b0b;margin-left:.4rem}
.backb{font-family:var(--f);font-size:.85rem;font-weight:700;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink2);padding:.4rem .9rem;border-radius:var(--pill);cursor:pointer}
.backb:hover{border-color:var(--ink);color:var(--ink)}
.opt.danger{border-color:var(--no);color:var(--no)}
.sec .sp,.gsec .sp{font-weight:500;opacity:.72;margin-left:.3rem}
.mt .pf{font-weight:700;color:var(--ink2)}
.gn .pf{font-size:.74rem;font-weight:600;color:var(--muted);margin-left:.3rem}
.brow .bn small{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-top:.05rem}
/* ── 인기 수업 ─────────────────────────────────────── */
.dgrid2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1rem;align-items:start}
@media (max-width:900px){.dgrid2{grid-template-columns:1fr}}
.ord,.pops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.ord li,.pop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8rem;align-items:center;
  padding:.75rem .85rem;border:1px solid var(--rule);border-radius:14px;background:var(--card)}
.ord .no,.pop .rk{width:1.9rem;height:1.9rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.9rem;background:var(--sunken);color:var(--ink2)}
.ord li:first-child .no{background:var(--ok);color:var(--onfill)}
.ob,.pb{min-width:0;display:flex;flex-direction:column;gap:.15rem}
.ob b,.pt b{font-size:.95rem;font-weight:800;letter-spacing:-.03em}
.ob small,.pb small{font-size:.78rem;color:var(--muted);font-weight:600}
.ow{font-size:.8rem;color:var(--ink2);font-weight:600}
.pb .btrack{height:.5rem;margin-top:.35rem}
.bfill.hot{background:var(--no)} .bfill.warm{background:var(--warn)} .bfill.cool{background:var(--good)}
.alt{font-size:.76rem;color:var(--good);font-weight:700;margin-top:.2rem}
.lv{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.76rem;font-weight:800;white-space:nowrap}
.lv em{font-style:normal;font-size:1.05rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lv.hot{color:var(--no)} .lv.warm{color:var(--warn)} .lv.cool{color:var(--good)}
/* ── 추천 ─────────────────────────────────────────── */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.55rem}
.tcard{font-family:var(--f);text-align:left;cursor:pointer;border:1px solid var(--rule2);background:var(--card);color:var(--ink);
  border-radius:16px;padding:.85rem 1rem;display:flex;flex-direction:column;gap:.2rem;min-height:2.75rem;transition:border-color .14s,background .14s}
.tcard b{font-size:.95rem;font-weight:800;letter-spacing:-.03em}
.tcard small{font-size:.78rem;color:var(--muted);font-weight:600}
.tcard:hover{border-color:var(--ok)}
.tcard[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--onfill)}
.tcard[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.tcard:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.rsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.6rem;margin-bottom:.8rem}
.rsum>div{border:1px solid var(--rule);border-radius:var(--r);padding:.8rem 1rem;background:var(--sunken)}
.rsum .v{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.04em}
.rsum .v small{font-size:.8rem;color:var(--muted);font-weight:600;margin-left:.15rem}
.rsum .k{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-top:.15rem}
.rdone{font-size:.82rem;color:var(--ink2);font-weight:600;margin:0 0 1rem}
.rcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
@media (max-width:900px){.rcols{grid-template-columns:1fr}}
.rcol{display:flex;flex-direction:column;gap:.55rem}
.rch{display:flex;align-items:baseline;gap:.5rem;padding:0 .2rem .3rem;border-bottom:2px solid var(--rule)}
.rcol:first-child .rch{border-color:var(--ok)}
.rch b{font-size:1rem;font-weight:800;letter-spacing:-.03em}
.rch span{font-size:.76rem;color:var(--muted);font-weight:600}
.rc{border:1px solid var(--rule);border-radius:14px;padding:.8rem .9rem;background:var(--card);display:flex;flex-direction:column;gap:.3rem;align-items:flex-start}
.rt{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;width:100%}
.rt b{font-size:.93rem;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.op{font-size:.7rem;font-weight:800;padding:.14rem .5rem;border-radius:var(--pill);white-space:nowrap;border:1px solid currentColor}
.op.ok{color:var(--good)} .op.mid{color:var(--blue2)} .op.no{color:var(--warn)}
.rm{font-size:.78rem;color:var(--ink2);font-weight:600}
.rw{font-size:.76rem;color:var(--muted);font-weight:500;margin:0;line-height:1.5}
.rmuted{font-size:.76rem;color:var(--muted);font-weight:500}
.hotx{color:var(--no);font-weight:800}
.opt.sm{font-size:.8rem;padding:.4rem .8rem;margin-top:.2rem;min-height:2.75rem}
.item.focus{outline:2.5px solid var(--ok);outline-offset:2px;transition:outline-color .4s}
.navrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.homeb{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--f);font-size:.85rem;font-weight:700;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink2);padding:0 1rem;min-height:2.75rem;
  border-radius:var(--pill);cursor:pointer}
.homeb:hover{border-color:var(--ink);color:var(--ink)}
.tabs{display:inline-flex;gap:.15rem;padding:.2rem;border-radius:var(--pill);background:var(--sunken);border:1px solid var(--rule)}
.tab{font-family:var(--f);font-size:.88rem;font-weight:700;border:0;background:transparent;color:var(--ink2);
  padding:0 1.1rem;min-height:2.75rem;border-radius:var(--pill);cursor:pointer;transition:background .14s,color .14s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--ok);color:var(--onfill)}
.homeb:focus-visible,.tab:focus-visible,.backb:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
@media (max-width:980px){
  .bento{grid-template-columns:1fr;grid-template-areas:"hero" "two" "three" "four" "wide"}
  .bcard.hero .btitle{font-size:1.75rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .left{border-right:0;border-bottom:1px solid var(--rule)}
  .right{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<button class="fab" id="fab" onclick="openSet()"><span class="dot"></span><span>설정 필요</span></button>

<div class="wrap top">
  <h1>ERICA 수강신청 도우미 <span class="draft">시안</span></h1>
  <div class="sizer">
    <span class="lb">화면</span>
    <button class="szb" data-sz="wide" aria-pressed="true">데스크탑</button>
    <button class="szb" data-sz="narrow" aria-pressed="false">모바일</button>
    <span class="lb" style="margin-left:.7rem">글자</span>
    <button class="szb" data-ui="1" aria-pressed="true">보통</button>
    <button class="szb" data-ui="1.25" aria-pressed="false">크게</button>
    <button class="szb" data-ui="1.55" aria-pressed="false">발표용</button>
  </div>
</div>

<div class="wrap" id="home">
  <div class="bento">
    <button class="bcard hero" onclick="go('pick')">
      <span class="bstep">2026-2학기 · 메인</span>
      <h2 class="btitle">시간표 짜기</h2>
      <p class="bdesc">담는 만큼 남은 요건이 줄고, 시간이 겹치면 비어 있는 분반을 알려줍니다.</p>
      <div class="brule"></div>
      <div class="stats">
        <div class="stat"><span class="v" id="hCnt">0</span><span class="k">담은 과목</span></div>
        <div class="stat"><span class="v" id="hCr">0</span><span class="k">담은 학점 — 상한 20</span></div>
        <div class="stat"><span class="v">27</span><span class="k">신청 가능 과목</span></div>
        <div class="stat"><span class="v" id="hReq">0/4</span><span class="k">충족한 요건</span></div>
      </div>
      <div class="btags"><span class="btag">빈 시간 찾기</span><span class="btag">요일 비우기</span><span class="btag">대안 분반</span></div>
      <span class="bgo">시간표 열기 <i>→</i></span>
    </button>

    <button class="bcard two" onclick="go('diag')">
      <span class="bstep">진단</span>
      <h2 class="btitle">남은 졸업요건</h2>
      <p class="bdesc">포털 성적조회를 붙여넣으면 영역별로 뭐가 남았는지 바로 나옵니다.
        <b>성적은 브라우저 안에만</b> 남습니다.</p>
      <div class="btags" id="hReqTags"></div>
      <span class="bgo">남은 요건 보기 <i>→</i></span>
    </button>

    <button class="bcard three" onclick="go('rec')">
      <span class="bstep">추천</span>
      <h2 class="btitle">하고 싶은 일로 고르는 수업</h2>
      <p class="bdesc">희망 직무를 고르면 남은 학기에 들을 수 있는 수업을 학기별로 보여줘요.</p>
      <div class="btags"><span class="btag">AE·브랜드</span><span class="btag">데이터 분석</span><span class="btag">미디어·퍼포먼스</span></div>
      <span class="bgo">추천 보기 <i>→</i></span>
    </button>

    <button class="bcard four" onclick="go('pick')">
      <span class="bstep">강의평<span class="soon" style="background:rgba(255,255,255,.22);color:#fff">준비 중</span></span>
      <h2 class="btitle">먼저 들은 사람의 말</h2>
      <p class="bdesc">가져온 후기가 아니라 여기서 처음 쌓이는 후기입니다. 그래서 지금은 비어 있습니다.</p>
      <div class="btags"><span class="btag">과제량</span><span class="btag">시험 방식</span><span class="btag">출석</span></div>
      <span class="bgo">후기 남기기 <i>→</i></span>
    </button>

    <button class="bcard wide" onclick="go('dash')">
      <div class="wl">
        <span class="bstep">인기 수업</span>
        <h2 class="btitle" style="font-size:1.3rem">뭘 먼저 잡아야 할까</h2>
        <p class="bdesc">지난 수강신청에서 정원보다 많이 몰린 수업과, 내가 담은 과목을 잡을 순서를 알려줘요.</p>
      </div>
      <div class="wr">
        <div class="stat"><span class="v">22</span><span class="k">정원 넘긴 전공 분반</span></div>
        <div class="stat"><span class="v">160<small style="font-size:.9rem">%</small></span><span class="k">가장 몰린 수업</span></div>
      </div>
      <span class="bgo" style="padding-top:0">인기 수업 보기 <i>→</i></span>
    </button>
  </div>
</div>




<div class="wrap" id="recwrap" hidden><div class="app">
  <div class="hdr">
    <nav class="navrow" aria-label="화면 이동">
      <button class="homeb" data-go="home"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v12h13V9"/></svg>선택 창</button>
      <span class="tabs"><button class="tab" data-go="pick">시간표</button><button class="tab" data-go="diag">진단</button><button class="tab" data-go="rec">추천</button><button class="tab" data-go="dash">인기 수업</button></span>
    </nav>
    <span class="sem">남은 학기 · 진로별</span>
  </div>
  <div style="padding:1.4rem" id="recbody"></div>
</div></div>

<div class="wrap" id="dashwrap" hidden><div class="app">
  <div class="hdr">
    <nav class="navrow" aria-label="화면 이동">
      <button class="homeb" data-go="home"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v12h13V9"/></svg>선택 창</button>
      <span class="tabs"><button class="tab" data-go="pick">시간표</button><button class="tab" data-go="diag">진단</button><button class="tab" data-go="rec">추천</button><button class="tab" data-go="dash">인기 수업</button></span>
    </nav><span class="sem">2026-2학기 수강신청 결과 기준</span>
  </div>
  <div style="padding:1.3rem" id="dashbody"></div>
</div></div>

<div class="wrap" id="setwrap" hidden><div class="app setwrap">
  <div class="hdr">
    <button class="backb" onclick="back()">← 뒤로</button>
    <span class="ttl">설정</span><span class="sem">학사 정보</span>
  </div>
  <div style="padding:1.5rem" id="setbody"></div>
</div></div>

<div class="wrap" id="diagwrap" hidden><div class="app" id="app2">
  <div class="hdr">

<script>
let SET={dept:null,cohort:null,year:null,loaded:false}, gateMsg=false;
const ready=()=>!!(SET.dept&&SET.cohort&&SET.year&&SET.loaded);
/* 남은 요건 — 광고홍보 2024학번 이후, 3학년 2학기 가정 */
const REQ=[
  {k:'전공핵심', need:9, unit:'학점', match:c=>c.g==='전공핵심'},
  {k:'전공심화', need:6, unit:'학점', match:c=>c.g==='전공심화'},
  {k:'교양선택', need:4, unit:'학점', match:c=>c.g==='교양선택'},
  {k:'영어전용', need:1, unit:'과목', match:c=>c.e, count:true}
];
const CAP=20, DAYS=['월','화','수','목','금'], H0=9, H1=18;
/* CSS의 --rowh / --head / --gut 와 같은 값. 배율이 바뀌면 다시 잰다. */
const base=()=>parseFloat(getComputedStyle(document.documentElement).fontSize)/16;
let ROW=30, HEAD=26, GUT=24;
function measure(){ const k=base(); ROW=30*k; HEAD=26*k; GUT=24*k; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let focusName=null;
let cart=[], filter=null, slotF=null, free=new Set(), PRE=null,
    undoItem=null, flashMsg=null, undoT=null, flashT=null, preT=null;
const byId=id=>C.find(c=>c.id===id);
const inCart=id=>cart.includes(id);
const onFreeDay=c=>c.s.some(s=>free.has(s.d));
const hitT=(a,b)=>a.s.some(x=>b.s.some(y=>x.d===y.d&&x.a<y.b&&y.a<x.b));
const clashWith=c=>cart.map(byId).filter(o=>o.id!==c.id&&hitT(c,o));
const credits=()=>cart.map(byId).reduce((a,c)=>a+c.cr,0);
function reqState(r){
  const got=cart.map(byId).filter(r.match);
  const p=r.count?got.length:got.reduce((a,c)=>a+c.cr,0);
  return {p, done:p>=r.need, pct:Math.min(100,Math.round(p/r.need*100))};
}
const doneCount=()=>REQ.filter(r=>reqState(r).done).length;

function toggle(id){
  const c=byId(id);
  if(inCart(id)){
    cart=cart.filter(x=>x!==id); undoItem=id; flashMsg=null;
    clearTimeout(undoT); undoT=setTimeout(()=>{undoItem=null;render();},6000);
    return render();
  }
  if(onFreeDay(c))        return flash('free',c);
  if(cart.map(byId).some(o=>o.n===c.n)) return flash('dup',c);
  if(clashWith(c).length) return flash('clash',c);
  if(credits()+c.cr>CAP)  return flash('cap',c);
  cart.push(id); undoItem=null; flashMsg=null; render();
}
function undo(){ if(undoItem){ cart.push(undoItem); undoItem=null; clearTimeout(undoT); render(); } }
function flash(kind,c){
  if(kind==='clash'){
    const alt=C.filter(o=>o.n===c.n&&o.id!==c.id&&!inCart(o.id)&&!clashWith(o).length&&!onFreeDay(o));
    flashMsg = alt.length
      ? {t:'warn',h:`<b>${esc(c.n)}</b>은(는) ${esc(clashWith(c)[0].n)}와 겹칩니다. 대신 <b>${esc(alt[0].t)}</b> 분반은 비어 있어요.`
          +`<button class="inline" onclick="toggle('${alt[0].id}')">그걸로 담기</button>`}
      : {t:'bad',h:`<b>${esc(c.n)}</b>은(는) ${esc(clashWith(c)[0].n)}와 겹치고, 다른 분반도 모두 겹칩니다.`};
  } else if(kind==='dup'){
    flashMsg={t:'warn',h:`<b>${esc(c.n)}</b>은(는) 이미 담았습니다. 같은 과목의 다른 분반은 함께 들을 수 없어요.`};
  } else if(kind==='free'){
    const d=c.s.map(s=>s.d).find(d=>free.has(d));
    flashMsg={t:'warn',h:`<b>${d}요일</b>을 비우기로 했는데 이 과목은 ${d}요일입니다.`
      +`<button class="inline ghostb" onclick="toggleDay('${d}')">${d}요일 비우기 해제</button>`};
  } else {
    flashMsg={t:'bad',h:`한 학기 <b>${CAP}학점</b>을 넘습니다. 다른 과목을 빼고 담아 보세요.`};
  }
  clearTimeout(flashT); flashT=setTimeout(()=>{flashMsg=null;render();},6000);
  render();
}
function verdict(){
  if(flashMsg) return flashMsg;
  if(undoItem) return {t:'',h:`<b>${esc(byId(undoItem).n)}</b>을(를) 뺐습니다.`
    +`<button class="inline ghostb" onclick="undo()">되돌리기</button>`};
  const cr=credits();
  if(!cart.length) return {t:'',h:'시간표 빈 칸을 누르면 그 시간에 들을 수 있는 과목만 남습니다.'};
  const left=REQ.filter(r=>!reqState(r).done);
  if(!left.length&&cr>=12) return {t:'good',h:`<b>이번 학기는 이걸로 충분합니다.</b> 남은 요건을 모두 채웠고 ${cr}학점입니다.`};
  if(!left.length) return {t:'good',h:`<b>남은 요건을 다 채웠어요.</b> 다만 ${cr}학점이라 졸업학점을 생각하면 조금 더 담아도 좋습니다.`};
  if(cr>=CAP-1) return {t:'warn',h:`<b>${cr}학점</b> — 상한 ${CAP}학점에 거의 찼습니다. ${left[0].k}이(가) ${left[0].need-reqState(left[0]).p}${left[0].unit} 남았는데 다음 학기로 넘겨야 할 수 있습니다.`};
  const near=left.map(r=>({r,s:reqState(r)})).find(x=>x.s.p>0);
  if(near) return {t:'warn',h:`<b>${near.r.k}</b> ${near.r.need-near.s.p}${near.r.unit}만 더 담으면 충족됩니다. 지금 ${cr}학점.`};
  return {t:'',h:`${cr}학점 담았습니다. 남은 요건: ${left.map(r=>r.k).join(' · ')}`};
}

function ttHTML(){
  let cells='';
  for(let hh=H0;hh<H1;hh++){
    cells+=`<div class="hr">${hh}</div>`;
    DAYS.forEach(d=>{
      const fd=free.has(d), pk=slotF&&slotF.d===d&&slotF.h===hh;
      cells+=`<button class="cell${fd?' freeday':''}${pk?' picked':''}"
        ${fd?'disabled':''} aria-label="${d}요일 ${hh}시" onclick="pickSlot('${d}',${hh})"></button>`;
    });
  }
  const grid=`<div class="grid"><div class="hd"></div>${DAYS.map(d=>
    `<div class="hd${free.has(d)?' free':''}">${d}</div>`).join('')}${cells}</div>`;
  const place=(sl,extra,inner,attrs)=>{
    const di=DAYS.indexOf(sl.d); if(di<0) return '';
    const top=HEAD+(sl.a-H0*60)/60*ROW+1, hgt=Math.max(18,(sl.b-sl.a)/60*ROW-3);
    return `<div class="blk${extra}" ${attrs} style="top:${top}px;height:${hgt}px;`
      +`left:calc(${GUT}px + 7px + ${di} * (100% - ${GUT}px - 14px)/5 + 2px);`
      +`width:calc((100% - ${GUT}px - 14px)/5 - 4px)">${inner}</div>`;
  };
  const tm=m=>`${Math.floor(m/60)}${m%60?':'+String(m%60).padStart(2,'0'):''}`;
  let blocks='';
  cart.map(byId).forEach(c=>{
    const bad=clashWith(c).length>0;
    c.s.forEach(sl=>{
      const tall=(sl.b-sl.a)/60*ROW>44;
      blocks+=place(sl, bad?' cl':'',
        `<span>${esc(c.n)}</span>${tall?`<span class="bt">${tm(sl.a)}–${tm(sl.b)}</span>`:''}`,
        `role="button" tabindex="0" title="${esc(c.n)} ${esc(c.t)}${c.p?' · '+esc(c.p):''} — 눌러서 빼기"
         onclick="toggle('${c.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle('${c.id}')}"`);
    });
  });
  if(PRE&&!inCart(PRE)){ const g=byId(PRE);
    if(g) g.s.forEach(sl=>{ blocks+=place(sl,' ghost',`<span>${esc(g.n)}</span>`,'aria-hidden="true"'); }); }
  return `<div class="tt">${grid}${blocks}</div>
    <div class="tthint">빈 칸을 누르면 그 시간 과목만 · 블록을 누르면 빼기</div>`;
}

function pickSlot(d,h){ slotF=(slotF&&slotF.d===d&&slotF.h===h)?null:{d,h}; if(slotF) filter=null; render(); }
function toggleDay(d){ free.has(d)?free.delete(d):free.add(d); flashMsg=null; render(); }
function setF(k){ filter=(filter===k)?null:k; if(filter) slotF=null; render(); }
function pre(id){ clearTimeout(preT); preT=setTimeout(()=>{ if(PRE!==id){PRE=id;render();} }, id?80:0); }

function filtered(){
  let v=C;
  if(slotF){
    const a=slotF.h*60, b=a+60;
    v=v.filter(c=>c.s.some(s=>s.d===slotF.d&&s.a<b&&a<s.b))
       .filter(c=>inCart(c.id)||(!clashWith(c).length&&!onFreeDay(c)));
  } else if(filter){
    const r=REQ.find(r=>r.k===filter);
    v=r?v.filter(r.match):v.filter(c=>c.g===filter);
  }
  return v;
}
function listHTML(items){
  if(!items.length) return `<div class="empty">${slotF
    ? `<b>${slotF.d}요일 ${slotF.h}시에 넣을 수 있는 과목이 없습니다.</b>
       <p>그 시간에 열리는 과목이 없거나, 이미 담은 과목과 겹칩니다.</p>
       <button class="opt" onclick="slotF=null;render()">시간 조건 풀기</button>`
    : `<b>조건에 맞는 과목이 없습니다.</b>
       <p>이수구분 필터나 비워 둔 요일이 너무 좁습니다.</p>
       <button class="opt" onclick="filter=null;free.clear();slotF=null;render()">조건 모두 풀기</button>`}</div>`;
  // 같은 교과목명은 한 장으로 묶고, 분반은 시간 칩으로 고른다
  const groups=[];
  items.forEach(c=>{
    let g=groups.find(g=>g.n===c.n);
    if(!g){ g={n:c.n, g:c.g, cr:c.cr, e:c.e, pbl:c.pbl, secs:[]}; groups.push(g); }
    g.secs.push(c);
  });
  return `<div class="list">${groups.map(G=>{
    const mine=G.secs.find(c=>inCart(c.id));
    const profs=[...new Set(G.secs.map(c=>c.p).filter(Boolean))], oneProf=profs.length===1;
    return `<div class="item${mine?' has':''}${focusName===G.n?' focus':''}" data-n="${esc(G.n)}">
      <div class="ihead">
        <div class="nm">${esc(G.n)}</div>
        <div class="mt"><span>${esc(G.g)} · ${G.cr}학점${oneProf?` · <b class="pf">${esc(profs[0])}</b>`:''}</span>
          ${G.e?'<span class="tag e">영어전용</span>':''}
          ${G.pbl?'<span class="tag p">IC-PBL</span>':''}
          ${G.secs.length>1?`<span class="tag">분반 ${G.secs.length}개</span>`:''}
        </div>
      </div>
      <div class="secs">${G.secs.map(c=>{
        const has=inCart(c.id), off=!has&&onFreeDay(c),
              dup=!has&&!off&&!!mine,
              cl=!has&&!off&&!dup&&clashWith(c).length>0;
        const rate=c.cap?Math.round(c.enr/c.cap*100):0, hot=rate>=100;
        const st=has?'on':off?'off':dup?'dup':cl?'cl':'';
        const why=has?'누르면 빼기':off?'비운 요일':dup?'다른 분반을 담았습니다':cl?`${clashWith(c)[0].n}와 겹침`:'누르면 담기';
        const rt=rate?` · 지난 수강신청 ${c.enr}/${c.cap}명 (${rate}%)`:'';
        return `<button class="sec ${st}" title="${esc(c.p)} · ${why}${rt}"
          onmouseenter="pre('${c.id}')" onmouseleave="pre(null)"
          onclick="toggle('${c.id}')">${esc(c.t)}${!oneProf&&c.p?`<span class="sp">${esc(c.p)}</span>`:''}${hot?`<i class="fl">${rate}%</i>`:''}</button>`;
      }).join('')}</div>
    </div>`;}).join('')}</div>`;
}

function render(){
  const cr=credits(), v=verdict();
  document.getElementById('left').innerHTML =
    ttHTML()
    + `<div class="freerow"><span class="lb">비울 요일</span>${DAYS.map(d=>
        `<button class="dayb" aria-pressed="${free.has(d)}" onclick="toggleDay('${d}')">${d}</button>`).join('')}</div>`
    + `<div class="sumbar"><div class="n">${cr}<span style="font-size:.84rem;color:var(--muted)">/${CAP}</span></div>
        <div class="x"><div class="lab">담은 학점</div>
          <div class="gauge"><i class="${cr>=12?'done':''}" style="width:${Math.min(100,cr/CAP*100)}%"></i></div></div></div>`
    + `<div class="msg ${v.t}">${v.h}</div>`
    + (cart.length?`<div class="mine"><div class="secl">담은 과목 ${cart.length}개</div>`
        + cart.map(byId).map(c=>`<div class="mrow"><span>${esc(c.n)}</span>
            <span class="g">${c.cr}학점 · ${esc(c.t)}</span>
            <button onclick="toggle('${c.id}')">빼기</button></div>`).join('')+`</div>`:'');

  const chips=REQ.map(r=>{const s=reqState(r), f=Math.round(s.pct/20);
    return `<button class="chip${s.done?' ok':' left'}" aria-pressed="${filter===r.k}" onclick="setF('${r.k}')">
      ${r.k}<span class="dots">${'●'.repeat(f)}${'○'.repeat(5-f)}</span>
      <span style="font-weight:400;font-size:.76rem">${s.done?'충족':`${r.need-s.p}${r.unit}`}</span></button>`;}).join('');
  const fbar = slotF
    ? `<div class="fbar">${slotF.d}요일 ${slotF.h}시에 넣을 수 있는 과목
        <button class="x" onclick="pickSlot('${slotF.d}',${slotF.h})" aria-label="해제">✕</button></div>`
    : filter ? `<div class="fbar">${esc(filter)}을(를) 채우는 과목
        <button class="x" onclick="setF('${filter}')" aria-label="해제">✕</button></div>` : '';
  document.getElementById('right').innerHTML =
    `<div class="chips">${chips}</div>` + fbar
    + (slotF||filter?'':`<div class="secl">전체 ${new Set(C.map(c=>c.n)).size}과목 · ${C.length}개 분반</div>`)
    + listHTML(filtered())
    + `<p class="foot-note">분반 옆 퍼센트는 <b>지난 수강신청 충원율</b>입니다. 지금 자리가 남았는지가 아니라
        그 시간대가 얼마나 몰렸는지를 보는 값입니다.</p>`;

  document.getElementById('cnt').innerHTML =
    `${cart.length}<small>과목</small> ${cr}<small>학점</small> <small>· 요건 ${doneCount()}/${REQ.length}</small>`;
  document.getElementById('pips').innerHTML = REQ.map(r=>`<i class="pip${reqState(r).done?' on':''}"></i>`).join('');
  save();
}

const GRAD=[
  {k:'전공핵심', need:30, got:21},
  {k:'전공심화', need:15, got:9},
  {k:'전공 택',  need:9,  got:9},

  {k:'산학협력', need:3,  got:3},
  {k:'사회봉사', need:1,  got:1},
  {k:'자유학점', need:58, got:48}
];
const TOTAL=126;
const EXTRA=[
  {k:'영어전용 강좌', need:2, got:1, unit:'개'},
  {k:'PBL 강좌',     need:2, got:2, unit:'개'},
  {k:'전공 IC-PBL',  need:1, got:0, unit:'개'},

];
/* 담기 화면의 요건명 → 졸업요건 항목 (담은 학점을 미리 비춰 준다) */
const PLANMAP={'전공핵심':'전공핵심','전공심화':'전공심화','교양선택':'교양선택'};
function plannedFor(key){
  return cart.map(byId).filter(c=>c.g===key).reduce((a,c)=>a+c.cr,0);
}
function renderDiag(){
  const got=GRAD.reduce((a,r)=>a+r.got,0);
  const planned=credits();
  const leftNow=TOTAL-got, leftAfter=Math.max(0,leftNow-planned);
  const pGot=got/TOTAL*100, pPlan=Math.min(100-pGot, planned/TOTAL*100);

  document.getElementById('dleft').innerHTML=
    `<div class="bignum">${leftNow}<small>학점 남음</small></div>
     <p class="bigsub">졸업학점 ${TOTAL}학점 중 <b>${got}학점</b> 이수</p>
     <div class="totg"><i class="got" style="width:${pGot}%"></i><i class="plan" style="width:${pPlan}%"></i></div>
     <div class="legrow">
       <span><i style="background:var(--ok)"></i>이수 ${got}</span>
       <span><i style="background:color-mix(in srgb,var(--ok) 38%,transparent)"></i>이번 학기 담음 ${planned}</span>
       <span><i style="background:var(--sunken);box-shadow:inset 0 0 0 1px var(--rule)"></i>남음 ${leftAfter}</span>
     </div>
     ${planned?`<p class="planline">지금 담은 ${planned}학점을 들으면 <b>${leftAfter}학점</b>이 남습니다.</p>`:''}
     <div class="extra">
       <div class="secl" style="margin-top:0">학점 외 요건</div>
       ${EXTRA.map(x=>{
         const done = x.done!==undefined ? x.done : x.got>=x.need;
         const val  = x.note || (done?'충족':`${x.need-x.got}${x.unit} 남음`);
         return `<div class="xrow${done?' done':''}">
           <span class="mk ${done?'y':'n'}">${done?'✓':'·'}</span>
           <span>${x.k}</span><span class="v">${val}</span></div>`;}).join('')}
     </div>
     <button class="cta" onclick="go('pick')">남은 요건으로 시간표 짜기 →</button>`;

  document.getElementById('dright').innerHTML=
    `<div class="secl" style="margin-top:0">영역별 이수 현황</div>
     <div class="areas">${GRAD.map(r=>{
       const pl=PLANMAP[r.k]?plannedFor(PLANMAP[r.k]):0;
       const done=r.got>=r.need, doneAfter=r.got+pl>=r.need;
       const g=Math.min(100,r.got/r.need*100), q=Math.min(100-g, pl/r.need*100);
       const leftN=Math.max(0,r.need-r.got-pl);
       return `<div class="arow${doneAfter?' done':''}">
         <div class="ahead"><span class="nm">${r.k}</span>
           <span class="st">${doneAfter?(done?'충족':'담으면 충족'):`${leftN}학점 남음`}</span></div>
         <div class="abar"><i class="got" style="width:${g}%"></i><i class="plan" style="width:${q}%"></i></div>
         <div class="anum">${r.need}학점 중 ${r.got}학점 이수${pl?` · 이번 학기 ${pl}학점 담음`:''}</div>
       </div>`;}).join('')}</div>`;
}


/* ── 설정: 학사 정보가 없으면 다른 탭을 열지 않는다 ── */
const DEPTS=[['광고홍보학과',1],['미디어학과',0],['문화인류학과',0],['문화콘텐츠학과',0]];
function setDept(d){ SET.dept=d; renderSet(); }
function setCohort(c){ SET.cohort=c; renderSet(); }
function setYear(y){ SET.year=y; renderSet(); }
function loadSample(){ SET.loaded=true; renderSet(); }
let resetArm=false, resetT=null;
function resetSet(){

        <p class="hint">포털 성적조회를 복사해 붙여넣으면 됩니다. 성적은 이 브라우저 안에만 남고 어디로도 보내지 않습니다.</p>
        <div class="pastebox${SET.loaded?' on':''}">
          ${SET.loaded
            ? `<div class="readout2">✓ 97학점 읽었습니다 — 2026-1학기까지</div>
               <button class="opt" style="margin-top:.8rem" onclick="SET.loaded=false;renderSet()">다시 넣기</button>`
            : `<p>여기에 붙여넣거나, 시연이면 예시를 불러오세요.</p>
               <button class="opt" onclick="loadSample()">예시 이수내역 불러오기</button>`}

        ? `<button class="cta" style="margin-top:0" onclick="finishSet()">저장하고 ${afterSet?NEXT[afterSet]:'시작하기'} →</button>`

let dashTab='major';
const lvOf=r=> r>=1 ? ['hot','먼저 잡기'] : r>=.85 ? ['warm','빨리 차요'] : ['cool','여유 있어요'];
function secOfCart(c){ return DASH.find(r=>r.n===c.n && r.t===c.t) || {n:c.n,t:c.t,p:c.p,e:c.enr,c:c.cap}; }
function renderDash(){
  /* 1. 내가 담은 과목을 잡을 순서 */
  const mine=cart.map(byId).filter(Boolean).map(c=>({c, r:secOfCart(c)}))
    .sort((a,b)=>rateOf(b.r)-rateOf(a.r));
  const order = mine.length
    ? `<ol class="ord">${mine.map(({c,r},i)=>{ const rt=rateOf(r), [lv,lb]=lvOf(rt);
        return `<li><span class="no">${i+1}</span>
          <div class="ob"><b>${esc(c.n)}</b><small>${esc(c.t)}${c.p?' · '+esc(c.p):''}</small>
            <span class="ow">지난번 ${r.c}자리에 ${r.e}명</span></div>
          <span class="lv ${lv}">${lb}<em>${Math.round(rt*100)}%</em></span></li>`;}).join('')}</ol>
       <p class="foot-note" style="margin-top:.7rem">수강신청이 열리면 위에서부터 누르세요. '여유 있어요'는 맨 나중에 잡아도 됩니다.</p>`
    : `<div class="empty"><b>아직 담은 과목이 없어요.</b><p>시간표에 담으면 어떤 순서로 잡을지 알려줄게요.</p>
         <button class="opt" data-go="pick">시간표 열기</button></div>`;

  /* 2. 인기 수업 */
  const pool=DASH.filter(r=> dashTab==='major' ? r.g.startsWith('전공') : !r.g.startsWith('전공'));
  const top=[...pool].sort((a,b)=>rateOf(b)-rateOf(a)).slice(0,10);
  const max=Math.max(1.0001, ...top.map(rateOf));
  const list=top.map((r,i)=>{
    const rt=rateOf(r), [lv,lb]=lvOf(rt);
    const alt=DASH.filter(x=>x.n===r.n && x!==r && rateOf(x)<.95 && rateOf(x)<=rt-.2).sort((a,b)=>rateOf(a)-rateOf(b))[0];
    const inC=cart.map(byId).some(c=>c&&c.n===r.n&&c.t===r.t);
    return `<li class="pop">
      <span class="rk">${i+1}</span>
      <div class="pb">
        <div class="pt"><b>${esc(r.n)}</b>${inC?'<span class="tag" style="margin-left:.4rem">담음</span>':''}</div>
        <small>${esc(r.t)}${r.p?' · '+esc(r.p):''} · ${r.c}자리에 ${r.e}명</small>
        <span class="btrack" style="--ref:${(1/max*100).toFixed(1)}%"><span class="bfill ${lv}" style="width:${(rt/max*100).toFixed(1)}%"></span></span>
        ${alt?`<span class="alt">덜 붐비는 분반: ${esc(alt.t)}${alt.p?' · '+esc(alt.p):''} ${Math.round(rateOf(alt)*100)}%</span>`:''}
      </div>
      <span class="lv ${lv}">${lb}<em>${Math.round(rt*100)}%</em></span></li>`;}).join('');

  document.getElementById('dashbody').innerHTML=
    `<div class="dgrid2">
      <section class="panel">
        <h3>내가 담은 과목, 이 순서로 잡으세요</h3>
        <p class="ph">지난 수강신청에서 빨리 찬 과목부터 줄 세웠어요.</p>
        ${order}
      </section>

  const el=document.querySelector(`#right .item[data-n="${CSS.escape(n)}"]`);
  if(el){ el.scrollIntoView({block:'center'}); setTimeout(()=>{focusName=null; el.classList.remove('focus');},2200); } }
function renderRec(){
  const T=RECDATA.TR, tr=T.find(t=>t.id===TRACK);
  const head=`<div class="sgroup" style="margin-bottom:1.2rem">
      <p class="q">졸업하고 어떤 일을 하고 싶어요?</p>
      <p class="hint">고르면 남은 학기 동안 들을 수 있는 그 분야 수업을 학기별로 보여줘요.</p>
      <div class="tcards">${T.map(t=>`<button class="tcard" aria-pressed="${t.id===TRACK}" onclick="setTrack('${t.id}')">
        <b>${esc(t.name)}</b><small>${esc(t.jobs)}</small></button>`).join('')}</div></div>`;
  if(!tr){ document.getElementById('recbody').innerHTML=head
      + `<p class="foot-note">분야는 학과 교육과정표의 과목 분류(기획 · 인사이트 및 데이터 · 퍼포먼스 및 미디어 · 크리에이티브 및 콘텐츠 · PR · 창업)를 따릅니다.</p>`; return; }
  const all=RECDATA.CURRI.filter(c=>c.t===tr.id);
  const done=all.filter(c=>RECDATA.TAKEN.includes(c.code));
  const rows=RECDATA.REC.filter(r=>r.track===tr.id);
  const sum=g=>rows.filter(r=>r.g===g && r.open!=='미정').reduce((a,r)=>a+r.cr,0);
  const need=k=>{ const g=GRAD.find(x=>x.k===k); return g?Math.max(0,g.need-g.got):0; };
  const cartN=new Set(cart.map(byId).filter(Boolean).map(c=>c.n));
  const pickN=new Set(C.map(c=>c.n));
  const col=sem=>{
    const rs=rows.filter(r=>r.sem===sem), [a,b]=SEMLB[sem];
    return `<div class="rcol"><div class="rch"><b>${a}</b><span>${b} · ${sem}</span></div>
      ${rs.length?rs.map(r=>{
        const [oc,ol]=OPENLB[r.open]||['mid',r.open];
        const secs=RECDATA.SEC[r.code]||[];
        const hot=secs.length?Math.max(...secs.map(x=>x.e/x.c)):0;
        const cur=RECDATA.CURRI.find(c=>c.code===r.code)||{};
        const act = sem==='2026-2'
          ? (cartN.has(r.name) ? `<span class="tag">담음</span>`
             : pickN.has(r.name) ? `<button class="opt sm" onclick="goPick('${esc(r.name)}')">시간표에서 담기</button>`
             : `<span class="rmuted">시간표 목록엔 아직 없어요</span>`)
          : '';
        return `<div class="rc">
          <div class="rt"><b>${esc(r.name)}</b><span class="op ${oc}">${ol}</span></div>
          ${cur.old?`<small class="rmuted">교육과정표 이름: ${esc(cur.old)}</small>`:''}
          <div class="rm">${esc(r.g)} · ${r.cr}학점${sem==='2026-2'&&secs.length?` · 분반 ${secs.length}개${hot>=1?` · <b class="hotx">지난번 ${Math.round(hot*100)}% — 먼저 잡기</b>`:''}`:''}</div>
          ${r.why?`<p class="rw">${esc(r.why)}</p>`:''}
          ${act}</div>`;}).join('')
        :`<p class="rmuted" style="padding:.4rem 0">이 학기엔 이 분야 과목이 없어요.</p>`}</div>`;
  };
  document.getElementById('recbody').innerHTML=head
    + (SET.year!==3?`<div class="notice" style="margin-bottom:1rem"><span>ⓘ</span><span>지금 보이는 추천은 <b>3학년 2학기 · 예시 이수내역</b> 기준이에요. 실제로는 학년과 이수내역에 맞춰 바뀝니다.</span></div>`:'')
    + `<div class="rsum">
        <div><span class="v">${done.length}<small>/${all.length}</small></span><span class="k">이 분야 과목 중 들은 것</span></div>
        <div><span class="v">${sum('전공심화')}<small>학점</small></span><span class="k">전공심화로 채울 수 있음 — 남은 요건 ${need('전공심화')}학점</span></div>
        <div><span class="v">${sum('전공핵심')}<small>학점</small></span><span class="k">전공핵심으로 채울 수 있음 — 남은 요건 ${need('전공핵심')}학점</span></div>
      </div>`
    + (done.length?`<p class="rdone">들은 과목: ${done.map(c=>esc(c.name)).join(' · ')}</p>`:'')
    + `<div class="rcols">${['2026-2','2027-1','2027-2'].map(col).join('')}</div>`
    + `<p class="foot-note">추천 규칙: 교육과정표의 분야 분류 × 실제로 열린 학기(2026년 기준) × 이미 들은 과목 제외.
        '열릴 예정'은 올해 같은 학기에 열렸던 과목, '개설 미정'은 올해 한 번도 안 열린 과목이에요. 학기별 개설은 바뀔 수 있어요.</p>`;
}

function paintHome(){
  const cr=credits();
  document.getElementById('hCnt').textContent=cart.length;
  document.getElementById('hCr').textContent=cr;
  document.getElementById('hReq').textContent=`${doneCount()}/${REQ.length}`;
  document.getElementById('hReqTags').innerHTML=REQ.map(r=>{const s=reqState(r);
    return `<span class="btag"${s.done?' style="border-color:var(--good);color:var(--good)"':''}>`
      +`${r.k} ${s.done?'충족':`${r.need-s.p}${r.unit}`}</span>`;}).join('');
}
/* ── 화면 이동: 주소(#pick 등) · 뒤로가기 · 스크롤 기억 · 저장 ── */
const SCREENS={home:'home',set:'setwrap',diag:'diagwrap',pick:'pickwrap',rec:'recwrap',dash:'dashwrap'};
const NEXT={pick:'시간표 열기',diag:'남은 요건 보기',rec:'추천 보기',dash:'인기 수업 보기'};
const STORE='erica-demo-v1';
const SCROLL={};
let cur=null, afterSet=null, depth=0;

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({SET, cart, free:[...free], TRACK, dashTab})); }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(STORE)||'null'); if(!d) return;
    if(d.SET) SET=Object.assign({dept:null,cohort:null,year:null,loaded:false}, d.SET);
    if(Array.isArray(d.cart)) cart=d.cart.filter(id=>byId(id));
    if(Array.isArray(d.free)) free=new Set(d.free);
    if(d.TRACK && RECDATA.TR.some(t=>t.id===d.TRACK)) TRACK=d.TRACK;
    if(d.dashTab) dashTab=d.dashTab;
  }catch(e){}
}
const inner=s=>['#right','#dright'].map(q=>document.querySelector('#'+SCREENS[s]+' '+q)).filter(Boolean);
function saveScroll(){
  if(cur) SCROLL[cur]={y:scrollY, r:inner(cur).map(e=>e.scrollTop)};
}
function restoreScroll(s){
  const v=SCROLL[s];
  inner(s).forEach((e,i)=>{ e.scrollTop = v ? (v.r[i]||0) : 0; });
  scrollTo({top: v ? v.y : 0, behavior:'instant'});
}
const routeOf=()=>{ const h=decodeURIComponent(location.hash.slice(1)); return SCREENS[h]?h:'home'; };
const urlOf=s=> s==='home' ? location.href.split('#')[0] : '#'+s;

function go(s, how='push'){
  if(!SCREENS[s]) s='home';
  const want=s;
  if((s==='pick'||s==='diag'||s==='dash'||s==='rec') && !ready()){ gateMsg=true; afterSet=s; s='set'; }
  if(s==='set') gateMsg = gateMsg && !ready();
  saveScroll();
  for(const k in SCREENS) document.getElementById(SCREENS[k]).hidden = k!==s;
  if(s==='pick') { measure(); render(); }
  else if(s==='diag'){
    const sem=document.querySelector('#diagwrap .sem');
    if(sem&&ready()) sem.textContent=`${SET.dept} ${SET.year}학년 · ${SET.cohort==='new'?'2024학번 이후':'2023학번 이전'}`;
    renderDiag();
  }
  else if(s==='set') renderSet();
  else if(s==='dash') renderDash();
  else if(s==='rec') renderRec();
  else paintHome();
  document.querySelectorAll('[data-go]').forEach(b=>{
    if(b.classList.contains('tab')) b.setAttribute('aria-current', b.dataset.go===s?'page':'false');
  });
  try{
    if(how==='push' && s!==cur){ depth++; history.pushState({s,d:depth},'',urlOf(s)); }
    else if(how==='replace' || (how==='pop' && want!==s)) history.replaceState({s,d:depth},'',urlOf(s));
  }catch(e){}
  cur=s;
  restoreScroll(s);
}
function back(){
  if(depth>0){ try{ history.back(); return; }catch(e){} }
  go('home');
}
function openSet(){
  gateMsg=false;
  if(cur && cur!=='set') afterSet = (cur==='home') ? null : cur;
  go('set');
}
function finishSet(){
  const to=afterSet||'home'; afterSet=null;
  go(to,'replace');
}
addEventListener('popstate',e=>{ depth=(e.state&&e.state.d)||0; go(routeOf(),'pop'); });
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
try{ history.scrollRestoration='manual'; }catch(e){}
document.querySelectorAll('.szb[data-sz]').forEach(b=>b.addEventListener('click',()=>{
  document.getElementById('app').classList.toggle('narrow', b.dataset.sz==='narrow');
  
document.querySelectorAll('.szb[data-sz]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  measure(); render();
}));
document.querySelectorAll('.szb[data-ui]').forEach(b=>b.addEventListener('click',()=>{
  document.documentElement.style.setProperty('--ui', b.dataset.ui);
  document.querySelectorAll('.szb[data-ui]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  measure(); render();
}));
addEventListener('resize',()=>{measure();render();});
load(); measure(); render(); renderSet(); paintHome();
go(routeOf(),'replace');
</script>
</body>
</html>
